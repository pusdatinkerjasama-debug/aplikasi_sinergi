    function formatDateFormatted(rawString) {
      if (!rawString) return "-";
      let str = String(rawString).trim();
      if (str.includes("T") || str.includes("-")) {
        let cleanPart = str.split("T")[0];
        let parts = cleanPart.split("-");
        if (parts.length === 3 && parts[0].length === 4) {
          return `${parts[2].padStart(2, '0')}/${parts[1].padStart(2, '0')}/${parts[0]}`;
        }
      }
      return str;
    }

    function parseDateToInput(rawString) {
      if (!rawString) return "";
      let str = String(rawString).trim();
      if (str.includes("T") || str.includes("-")) {
        return str.split("T")[0];
      }
      return str;
    }

    function formatRuangLingkup(text, isHtml = false) {
      if (!text) return "-";
      let cleanText = String(text).trim();
      let formatted = cleanText.replace(/(\d+\.\s+)/g, (match, p1, offset) => {
        return offset === 0 ? p1 : (isHtml ? "<br/>" + p1 : "\n" + p1);
      });
      return formatted;
    }

        if (editingUser) payload.oldUsername = editingUser.username;

        try {
          showToast("Menyimpan user ke database Sheet...");
          const res = await fetch(APPS_SCRIPT_URL, {
            method: "POST",
            headers: { "Content-Type": "text/plain;charset=utf-8" },
            body: JSON.stringify({ action: actionType, payload })
          });
          const result = await res.json();
          if (result.success) {
            showToast("Data User berhasil disimpan!");
            fetchUsers();
            setUserFormData({ username: "", password: "", role: "Operator" });
            setEditingUser(null);
          } else {
            alert("Gagal menyimpan user.");
          }
        } catch (err) {
          showToast("Gagal menyimpan user ke server.");
        }
      };

      const handleEditUser = (u) => {
        setEditingUser(u);
        setUserFormData({ username: u.username, password: u.password, role: u.role || "Operator" });
      };

      const handleDeleteUser = async (uname) => {
        if (confirm(`Yakin ingin menghapus user '${uname}'?`)) {
          try {
            await fetch(APPS_SCRIPT_URL, {
              method: "POST",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify({ action: "deleteUser", username: uname })
            });
            showToast("User berhasil dihapus.");
            fetchUsers();
          } catch(e) {
            showToast("Gagal menghapus user.");
          }
        }
      };

      const expiringSoonList = useMemo(() => {
        const today = new Date();
        today.setHours(0, 0, 0, 0);
        let soon = [];
        pksList.forEach(item => {
          if (!item.tanggalSelesai) return;
          const cleanDateStr = parseDateToInput(item.tanggalSelesai);
          const endDate = new Date(cleanDateStr);
          if (isNaN(endDate.getTime())) return;
          const diffTime = endDate - today;
          const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
          if (diffDays >= 0 && diffDays <= 90) {
            soon.push(item);
          }
        });
        return soon;
      }, [pksList]);

      const listMitra = useMemo(() => {
        const setMitra = new Set();
        pksList.forEach(item => { if (item.namaMitra) setMitra.add(item.namaMitra); });
        return Array.from(setMitra);
      }, [pksList]);

      const filteredPks = useMemo(() => {
        const today = new Date();
        today.setHours(0, 0, 0, 0);

        let list = pksList.filter(item => {
          const matchSearch = (item.judul || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.nomorPks || '').toLowerCase().includes(searchQuery.toLowerCase()) ||
                              (item.namaMitra || '').toLowerCase().includes(searchQuery.toLowerCase());
          
          const matchStatus = statusFilter === "ALL" || item.statusCapaian === statusFilter;
          
          const itemEs1 = String(item.unitKerjaEs1 || item.unitKerja || '').trim().toLowerCase();
          const filterEs1 = String(unitFilter).trim().toLowerCase();
          const matchUnit = unitFilter === "ALL" || itemEs1 === filterEs1;

          const itemEs2 = String(item.unitKerjaEs2 || '').trim().toLowerCase();
          const filterEs2 = String(unitEs2Filter).trim().toLowerCase();
          const matchUnitEs2 = unitEs2Filter === "ALL" || itemEs2 === filterEs2;

          const matchMitra = mitraFilter === "ALL" || item.namaMitra === mitraFilter;

          let matchTahun = true;
          if (tahunFilter !== "ALL") {
            const tahunMulai = item.tanggalMulai ? String(item.tanggalMulai).substring(0, 4) : "";
            matchTahun = (tahunMulai === tahunFilter);
          }

          let matchMasaBerlaku = true;
          if (masaBerlakuFilter !== "ALL" && item.tanggalMulai && item.tanggalSelesai) {
            const start = new Date(parseDateToInput(item.tanggalMulai));
            const end = new Date(parseDateToInput(item.tanggalSelesai));
            const diffTime = Math.abs(end - start);
            const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
            const calculatedYears = Math.round(diffDays / 365);
            const targetYears = parseInt(masaBerlakuFilter.split(" ")[0]);
            matchMasaBerlaku = (calculatedYears === targetYears);
          }

          let matchExpiry = true;
          if (expiryFilter !== "ALL" && item.tanggalSelesai) {
            const cleanDateStr = parseDateToInput(item.tanggalSelesai);
            const endDate = new Date(cleanDateStr);
            if (!isNaN(endDate.getTime())) {
              const diffDays = Math.ceil((endDate - today) / (1000 * 60 * 60 * 24));
              if (expiryFilter === "AKAN_BERAKHIR") matchExpiry = (diffDays >= 0 && diffDays <= 90);
              else if (expiryFilter === "SUDAH_BERAKHIR") matchExpiry = (diffDays < 0);
            }
          }

          return matchSearch && matchStatus && matchUnit && matchUnitEs2 && matchMitra && matchTahun && matchMasaBerlaku && matchExpiry;
        });

        return [...list].sort((a, b) => {
          if (mitraSortOrder === "asc") {
            return String(a.namaMitra || '').localeCompare(String(b.namaMitra || ''), 'id', { sensitivity: 'base' });
          } else if (mitraSortOrder === "desc") {
            return String(b.namaMitra || '').localeCompare(String(a.namaMitra || ''), 'id', { sensitivity: 'base' });
          }
          
          if (judulSortOrder === "asc") {
            return String(a.judul || '').localeCompare(String(b.judul || ''), 'id', { sensitivity: 'base' });
          } else if (judulSortOrder === "desc") {
            return String(b.judul || '').localeCompare(String(a.judul || ''), 'id', { sensitivity: 'base' });
          }

          const tglA = a.tanggalMulai ? new Date(parseDateToInput(a.tanggalMulai)).getTime() : 0;
          const tglB = b.tanggalMulai ? new Date(parseDateToInput(b.tanggalMulai)).getTime() : 0;
          return tglB - tglA;
        });
      }, [pksList, searchQuery, statusFilter, unitFilter, unitEs2Filter, mitraFilter, tahunFilter, masaBerlakuFilter, expiryFilter, mitraSortOrder, judulSortOrder]);

      const paginatedPks = useMemo(() => {
        const startIndex = (currentPage - 1) * pageSize;
        return filteredPks.slice(startIndex, startIndex + pageSize);
      }, [filteredPks, currentPage, pageSize]);

      const totalPages = Math.ceil(filteredPks.length / pageSize) || 1;

      const stats = useMemo(() => {
        const total = filteredPks.length;
        const hijau = filteredPks.filter(p => p.statusCapaian === "Hijau").length;
        const kuning = filteredPks.filter(p => p.statusCapaian === "Kuning").length;
        const merah = filteredPks.filter(p => p.statusCapaian === "Merah").length;

        return { total, hijau, kuning, merah };
      }, [filteredPks]);

      const handleSavePks = async (e) => {

        const out = parseFloat(formData.capaianOutput) || 0;

        const skorAkhir = (keg * 0.4) + (out * 0.4) + (dok * 0.2);
        
        let statusCapaian = "Merah";
        if (skorAkhir >= 80) statusCapaian = "Hijau";
        else if (skorAkhir >= 60) statusCapaian = "Kuning";

        let actionType = editingId ? "updatePKS" : "savePKS";
        
        let targetPayload = {
          id: editingId || `PKS-${Date.now()}`,
          nomorPks: formData.nomorPks || "",
          judul: formData.judul || "",
          jenis: formData.jenis || "Nasional",
          unitKerjaEs1: formData.unitKerjaEs1 || "",
          unitKerjaEs2: formData.unitKerjaEs2 || "",
          mitraId: formData.mitraId || "",
          namaMitra: formData.namaMitra || "",
          picMitra: formData.picMitra || "",
          kontakMitra: formData.kontakMitra || "",
          tanggalMulai: formData.tanggalMulai || "",
          tanggalSelesai: formData.tanggalSelesai || "",
          ruangLingkup: formData.ruangLingkup || "",
          capaianKegiatan: keg,
          capaianOutput: out,
          kelengkapanDokumen: dok,
          statusCapaian: statusCapaian,
          skorAkhir: parseFloat(skorAkhir.toFixed(2)),
          dokumenUploaded: formData.dokumenUploaded || formData.dokumenUrl || "",
          dokumenBase64: formData.dokumenBase64 || "",
          dokumenName: formData.dokumenName || "",
          dokumenMimeType: formData.dokumenMimeType || ""
        };

        if (APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes("AKfycbx...")) {
          showToast("Menyimpan data...");
          try {
            const response = await fetch(APPS_SCRIPT_URL, {
              method: "POST",
              headers: { "Content-Type": "text/plain;charset=utf-8" },
              body: JSON.stringify({
                action: actionType,
                payload: targetPayload,
                user: role
              })
            });
            const result = await response.json();
            if (result.success) {
              if (result.dokumenUrl) {
                targetPayload.dokumenUploaded = result.dokumenUrl;
                targetPayload.dokumenUrl = result.dokumenUrl;
              }
              showToast("Dokumen & Data PKS Berhasil Disimpan!");
              fetchPksData();
            } else {
              alert("Gagal menyimpan ke server: " + (result.error || "Unknown error"));
            }
          } catch (error) {
            console.error(error);
            showToast("Gagal terhubung ke server. Periksa koneksi Anda.");
            return;
          }
        } else {
          showToast("Data PKS Berhasil Disimpan (Mode Lokal)!");
        }

        if (editingId) {
          setPksList(pksList.map(item => item.id === editingId ? targetPayload : item));
        } else {
          setPksList([targetPayload, ...pksList]);
        }

        setEditingId(null);
        setFormData(EMPTY_FORM);
        setActiveTab("data-pks");
      };

      const handleEditClick = (item) => {
        setEditingId(item.id);
        const cleanMulai = parseDateToInput(item.tanggalMulai);
        const cleanSelesai = parseDateToInput(item.tanggalSelesai);
        const docLink = item.dokumenUploaded || item.dokumenUrl || "";
        const existingFileName = item.dokumenName || (docLink ? decodeURIComponent(docLink.split('/').pop().split('?')[0]) : null);

        const initialEs1 = item.unitKerjaEs1 || item.unitKerja || "Sekretariat Jenderal";
        const availableEs2List = ESELON_2_MAPPING[initialEs1] || [];
        const initialEs2 = item.unitKerjaEs2 || (availableEs2List.length > 0 ? availableEs2List[0] : "");

        setFormData({
          nomorPks: item.nomorPks || "",
          judul: item.judul || "",
          jenis: item.jenis || "Nasional",
          unitKerjaEs1: initialEs1,
          unitKerjaEs2: initialEs2,
          mitraId: item.mitraId || item.mitraid || "",
          namaMitra: item.namaMitra || item.namamitra || "",
          picMitra: item.picMitra || item.picmitra || "",
          kontakMitra: item.kontakMitra || item.kontakmitra || "",
          tanggalMulai: cleanMulai,

          ruangLingkup: item.ruangLingkup || "",
          capaianKegiatan: item.capaianKegiatan !== undefined && item.capaianKegiatan !== null ? item.capaianKegiatan : "",
          capaianOutput: item.capaianOutput !== undefined && item.capaianOutput !== null ? item.capaianOutput : "",
          kelengkapanDokumen: item.kelengkapanDokumen !== undefined && item.kelengkapanDokumen !== null ? item.kelengkapanDokumen : "",
          dokumenFile: existingFileName,
          dokumenUrl: docLink,
          dokumenUploaded: docLink,
          dokumenBase64: "",
          dokumenName: existingFileName || "",
          dokumenMimeType: ""
        });
        setActiveTab("tambah-pks");
      };

      const handleDeletePks = async (id) => {

          if (APPS_SCRIPT_URL && !APPS_SCRIPT_URL.includes("AKfycbx...")) {
            try {
              showToast("Menghapus data dari server/Database...");
              const response = await fetch(APPS_SCRIPT_URL, {
                method: "POST",
                headers: { "Content-Type": "text/plain;charset=utf-8" },
                body: JSON.stringify({
                  action: "deletePKS",
                  id: id,
                  payload: { id: id },
                  user: role
                })
              });
              const result = await response.json();
              if (result && (result.success !== false)) {
                showToast("Data PKS berhasil dihapus dari aplikasi & database.");
                fetchPksData();
              } else {
                showToast("Gagal menghapus dari database server.");
                fetchPksData();
              }
            } catch(e) {
              showToast("Gagal terhubung ke database untuk menghapus data.");
              fetchPksData();
            }
          } else {
            showToast("Data PKS berhasil dihapus (Lokal).");
          }
        }
      };

      if (!isLoggedIn) {
        return (

              <div className="absolute top-0 left-0 right-0 h-1.5 bg-gradient-to-r from-neon-cyan via-neon-blue to-neon-teal"></div>
              <div className="flex flex-col items-center text-center space-y-3">
                <div className="w-20 h-20 bg-white p-2.5 rounded-2xl shadow-xl flex items-center justify-center border border-neon-cyan/50 shadow-[0_0_15px_rgba(0,229,255,0.22)]">
                  <img src="Logo KKP.png" alt="Logo KKP RI" className="max-w-full max-h-full object-contain" onError={(e)=>{e.target.onerror=null; e.target.src='https://upload.wikimedia.org/wikipedia/commons/9/91/Lambang_Kementerian_Kelautan_dan_Perikanan_Republik_Indonesia.png';}} />
                </div>
                <div>
                  <h2 className="text-xl font-extrabold text-neon-textPrimary">Sistem Informasi Kerja Sama Terintegrasi SINERGI</h2>
                  <p className="text-xs font-bold text-neon-cyan mt-0.5">Enterprise Dashboard</p>
                </div>
              </div>

              <form onSubmit={handleLogin} className="space-y-4">
                <div>
                  <label className="text-xs font-bold text-neon-textSecondary block mb-1">Username / NIP</label>
                  <input 
                    type="text" 
                    required 
                    placeholder="Username database" 
                    value={loginUser} 
                    onChange={(e) => setLoginUser(e.target.value)} 
                    className="w-full border border-neon-cyan/40 bg-neon-secondary/80 rounded-2xl p-3 text-xs text-neon-textPrimary font-semibold focus:border-neon-cyan focus:ring-1 focus:ring-neon-cyan focus:outline-none transition-all" 
                  />
                </div>
                <div>
                  <label className="text-xs font-bold text-neon-textSecondary block mb-1">Password</label>
                  <input 
                    type="password" 
                    required 
                    placeholder="••••••••" 
                    value={loginPass} 
                    onChange={(e) => setLoginPass(e.target.value)} 
                    className="w-full border border-neon-cyan/40 bg-neon-secondary/80 rounded-2xl p-3 text-xs text-neon-textPrimary font-semibold focus:border-neon-cyan focus:ring-1 focus:ring-neon-cyan focus:outline-none transition-all" 
                  />
                </div>
                <button type="submit" disabled={isLoadingLogin} className="w-full bg-gradient-to-r from-neon-cyan to-neon-teal text-[#031323] py-3.5 rounded-2xl text-xs font-extrabold shadow-[0_0_20px_rgba(0,229,255,0.4)] hover:shadow-[0_0_25px_rgba(0,229,255,0.65)] transition-all cursor-pointer">
                  {isLoadingLogin ? "Verifikasi 'User'..." : "Masuk ke Sistem"}
                </button>
              </form>
            </div>
          </div>
        );
      }

      return (
        <div className="min-h-screen flex flex-col bg-neon-bg text-neon-textPrimary relative selection:bg-neon-cyan selection:text-neon-bg">
          
          {toastMessage && (
            <div className="fixed bottom-5 right-5 z-50 glass-panel bg-neon-panelSec text-neon-textPrimary px-5 py-3 rounded-2xl shadow-2xl flex items-center space-x-3 border border-neon-cyan/60 shadow-[0_0_20px_rgba(0,229,255,0.3)] no-print">
              <i data-lucide="check-circle" className="text-neon-teal w-5 h-5"></i>
              <span className="text-xs font-semibold">{toastMessage}</span>
            </div>
          )}

          <div className="print-header">
            <div style={{ textAlign: 'center', marginBottom: '20px' }}>
              <h2 style={{ fontSize: '13pt', fontWeight: 'bold', color: '#000000', textTransform: 'uppercase', margin: '0 0 4px 0' }}>
                REKAPITULASI KERJA SAMA
              </h2>
              <h3 style={{ fontSize: '12pt', fontWeight: 'bold', color: '#000000', textTransform: 'uppercase', margin: '0 0 6px 0' }}>
                KEMENTERIAN KELAUTAN DAN PERIKANAN
              </h3>
              <p style={{ fontSize: '11pt', fontWeight: 'bold', color: '#000000', margin: 0 }}>
                {unitFilter === "ALL" ? "Semua Unit Kerja" : unitFilter} {unitEs2Filter !== "ALL" ? ` - ${unitEs2Filter}` : ""}
              </p>
            </div>
          </div>

          <header className="bg-neon-secondary/95 backdrop-blur-md text-neon-textPrimary sticky top-0 z-40 border-b border-neon-cyan/30 no-print shadow-[0_4px_25px_rgba(0,0,0,0.4)]">
            <div className="absolute bottom-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-neon-cyan to-transparent"></div>
            <div className="px-6 py-3.5 flex items-center justify-between">
              
              <div className="flex items-center space-x-3">
                <div className="bg-white p-1.5 rounded-xl flex items-center justify-center border border-neon-cyan/50 w-11 h-11 overflow-hidden shadow-[0_0_12px_rgba(0,229,255,0.22)]">
                  <img src="Logo KKP.png" alt="Logo KKP RI" className="max-w-full max-h-full object-contain" onError={(e)=>{e.target.onerror=null; e.target.src='https://upload.wikimedia.org/wikipedia/commons/9/91/Lambang_Kementerian_Kelautan_dan_Perikanan_Republik_Indonesia.png';}} />
                </div>
                <div>
                  <h1 className="font-extrabold text-base tracking-wide flex items-center gap-2">
                    Sistem Informasi Kerja Sama Terintegrasi
                    <span className="text-[9px] font-bold bg-neon-cyan/20 text-neon-cyan px-2.5 py-0.5 rounded-full border border-neon-cyan/50 backdrop-blur-md shadow-[0_0_8px_rgba(0,229,255,0.22)]">KKP RI</span>
                  </h1>
                  <p className="text-[10px] font-semibold text-neon-textSecondary tracking-wide">SINERGI PUSDATIN</p>

              <div className="hidden md:flex flex-1 max-w-md mx-8 relative">

                <input

              <div className="flex items-center space-x-3">

                  <button

                  >

                  {showNotifDropdown && (

                      <div className="flex items-center justify-between border-b border-neon-cyan/30 pb-2">

                </div>

                <div className="flex items-center bg-neon-panel rounded-2xl p-1.5 border border-neon-cyan/40 backdrop-blur-md">

                  >

                      )}
                    </div>

                    <div className="flex items-center justify-end space-x-3 pt-4 border-t border-neon-cyan/20">
                      <button 
                        type="button" 
                        onClick={() => handleMenuClick("data-pks")}
                        className="px-5 py-2.5 bg-neon-secondary/80 hover:bg-neon-panelSec text-neon-textSecondary rounded-2xl text-xs font-bold border border-neon-cyan/30 transition-all cursor-pointer"
                      >
                        Batal
                      </button>
                      <button 
                        type="submit" 
                        className="px-6 py-2.5 bg-gradient-to-r from-neon-cyan to-neon-teal text-[#031323] rounded-2xl text-xs font-extrabold shadow-[0_0_15px_rgba(0,229,255,0.3)] hover:shadow-[0_0_20px_rgba(0,229,255,0.6)] transition-all cursor-pointer"
                      >
                        {editingId ? "Simpan Perubahan" : "Simpan Data PKS"}
                      </button>
                    </div>
                  </form>
                </div>
              )}

              {activeTab === "pengaturan-user" && role === "Administrator" && (
                <div className="space-y-6 max-w-4xl mx-auto">
                  <div>
                    <h2 className="text-base font-extrabold text-neon-textPrimary">Manajemen Pengguna</h2>
                    <p className="text-xs text-neon-textMuted">Kelola akun akses pengguna SINERGI</p>
                  </div>

                  <form onSubmit={handleSaveUser} className="glass-panel p-6 rounded-3xl border border-neon-cyan/40 space-y-4">
                    <h3 className="text-xs font-bold text-neon-cyan uppercase tracking-wider">{editingUser ? "Edit User" : "Tambah User Baru"}</h3>
                    <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                      <div>
                        <label className="text-xs font-bold text-neon-textSecondary block mb-1">Username / NIP</label>
                        <input 
                          type="text" 
                          required 
                          value={userFormData.username} 
                          onChange={(e) => setUserFormData({...userFormData, username: e.target.value})}
                          className="w-full bg-[#07172F] border border-neon-cyan/40 rounded-2xl p-2.5 text-xs text-neon-textPrimary focus:outline-none focus:border-neon-cyan" 
                        />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-neon-textSecondary block mb-1">Password</label>
                        <input 
                          type="password" 
                          required 
                          value={userFormData.password} 
                          onChange={(e) => setUserFormData({...userFormData, password: e.target.value})}
                          className="w-full bg-[#07172F] border border-neon-cyan/40 rounded-2xl p-2.5 text-xs text-neon-textPrimary focus:outline-none focus:border-neon-cyan" 
                        />
                      </div>
                      <div>
                        <label className="text-xs font-bold text-neon-textSecondary block mb-1">Role / Hak Akses</label>
                        <select 
                          value={userFormData.role} 
                          onChange={(e) => setUserFormData({...userFormData, role: e.target.value})}
                          className="w-full bg-[#07172F] border border-neon-cyan/40 rounded-2xl p-2.5 text-xs text-neon-textPrimary focus:outline-none focus:border-neon-cyan"
                        >
                          <option value="Administrator">Administrator</option>
                          <option value="Operator">Operator</option>
                          <option value="Pimpinan">Pimpinan</option>
                        </select>
                      </div>
                    </div>
                    <div className="flex justify-end space-x-3 pt-2">
                      {editingUser && (
                        <button 
                          type="button" 
                          onClick={() => { setEditingUser(null); setUserFormData({ username: "", password: "", role: "Operator" }); }}
                          className="px-4 py-2 bg-neon-secondary text-neon-textSecondary rounded-2xl text-xs font-bold border border-neon-cyan/30"
                        >
                          Batal
                        </button>
                      )}
                      <button 
                        type="submit" 
                        className="px-5 py-2 bg-gradient-to-r from-neon-cyan to-neon-teal text-[#031323] rounded-2xl text-xs font-bold shadow-[0_0_12px_rgba(0,229,255,0.3)]"
                      >
                        {editingUser ? "Perbarui User" : "Tambah User"}
                      </button>
                    </div>
                  </form>

                  <div className="glass-panel p-4 rounded-3xl border border-neon-cyan/40">
                    <div className="overflow-x-auto custom-scrollbar">
                      <table className="w-full text-left text-xs border-collapse">
                        <thead>
                          <tr className="border-b border-neon-cyan/30 text-neon-cyan font-bold bg-neon-secondary/40">
                            <th className="p-3">Username</th>
                            <th className="p-3">Role</th>
                            <th className="p-3 text-center">Aksi</th>
                          </tr>
                        </thead>
                        <tbody className="divide-y divide-neon-cyan/10">
                          {userList.length === 0 ? (
                            <tr>
                              <td colSpan="3" className="p-4 text-center text-neon-textMuted">Belum ada user terdaftar di database.</td>
                            </tr>
                          ) : (
                            userList.map((u, idx) => (
                              <tr key={idx} className="hover:bg-neon-panelSec/50 transition-all">
                                <td className="p-3 font-semibold text-neon-textPrimary">{u.username}</td>
                                <td className="p-3 text-neon-textSecondary">{u.role}</td>
                                <td className="p-3 text-center">
                                  <div className="flex items-center justify-center space-x-2">
                                    <button onClick={() => handleEditUser(u)} className="p-1.5 bg-neon-warning/20 text-neon-warning rounded-lg hover:bg-neon-warning hover:text-[#031323]">
                                      <i data-lucide="edit" className="w-3.5 h-3.5"></i>
                                    </button>
                                    <button onClick={() => handleDeleteUser(u.username)} className="p-1.5 bg-neon-danger/20 text-neon-danger rounded-lg hover:bg-neon-danger hover:text-white">
                                      <i data-lucide="x" className="w-3.5 h-3.5"></i>
                                    </button>
                                  </div>
                                </td>
                              </tr>
                            ))
                          )}
                        </tbody>
                      </table>
                    </div>
                  </div>
                </div>
              )}

            </main>
          </div>
        </div>
      );
    }

    const rootElement = document.getElementById("root");
    const root = ReactDOM.createRoot(rootElement);
    root.render(<App />);
  </script>
</body>
</html>
